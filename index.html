<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わが家の備蓄帳</title>
<meta name="theme-color" content="#17262B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="備蓄帳">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=Roboto+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#E8EDEB; --surface:#F7F9F8; --ink:#17262B; --muted:#5A6A6E; --line:#C8D2D0;
  --accent:#1F5F8B; --accent-ink:#FFFFFF; --mark:#F2B705; --mark-ink:#17262B;
  --bad:#B8322A; --warn:#B76E00; --soon:#1F5F8B; --ok:#2E7A57;
  --warn-bg:#F7E9CF; --shade:rgba(10,20,24,.45);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F171A; --surface:#172226; --ink:#E5ECEA; --muted:#93A3A6; --line:#2A393E;
  --accent:#71B2DB; --accent-ink:#0F171A; --soon:#71B2DB;
  --bad:#FF7A6E; --warn:#F2AA3C; --ok:#5DC292; --warn-bg:#3A2D14; --shade:rgba(0,0,0,.6); color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{padding-block:18px 0}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--mark) 0 10px,var(--mark-ink) 10px 20px);border-radius:2px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 14px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.65rem;line-height:1.2;margin:0;letter-spacing:.02em}
.today{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.acct{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.75rem;color:var(--muted)}
.offline{font-size:.75rem;border-radius:999px;padding:2px 10px;background:var(--warn-bg);color:var(--warn);font-weight:700}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.tile b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}

nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:4px}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-size:.92rem}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--mark)}
nav.tabs .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-left:3px}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

.list{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;width:100%;text-align:left;overflow:hidden}
.row .stripe{align-self:stretch;margin-block:-10px;background:var(--line)}
.row.bad .stripe{background:var(--bad)} .row.warn .stripe{background:var(--warn)} .row.soon .stripe{background:var(--soon)} .row.ok .stripe{background:var(--ok)}
.row .main{min-width:0}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .meta{display:block;font-size:.8rem;color:var(--muted)}
.row .exp{text-align:right;font-family:var(--f-mono);font-size:.8rem;white-space:nowrap}
.row .left{display:block;font-family:var(--f-body);font-weight:700;font-size:.85rem}
.row.bad .left{color:var(--bad)} .row.warn .left{color:var(--warn)} .row.soon .left{color:var(--soon)} .row.ok .left{color:var(--ok)}
.cat{display:inline-block;font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--muted)}

.empty{border:2px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

.need{display:flex;flex-direction:column;gap:14px}
.house{display:flex;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .lbl{font-size:.85rem;color:var(--muted);min-width:2.5em}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.stepper output{font-family:var(--f-mono);min-width:2.2em;text-align:center;font-size:1.05rem}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.gauge h3{margin:0;font-size:1rem}
.gauge .nums{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.bar{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:7px}
.bar i.short{background:var(--warn)} .bar i.none{background:var(--bad)}
.verdict{font-size:.85rem}
.verdict.short{color:var(--warn);font-weight:700} .verdict.ok{color:var(--ok);font-weight:700}
.note{font-size:.8rem;color:var(--muted)}

.shop-add{display:flex;gap:8px;margin-bottom:12px}
.shop-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.srow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.srow .main{flex:1;min-width:0}
.srow .name{font-weight:700;overflow-wrap:anywhere}
.btn{border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;font-weight:700;font-size:.88rem;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);grid-row:span 2}
.log .who{font-size:.78rem;color:var(--muted)}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--mark);color:var(--mark-ink);border:2px solid var(--mark-ink);border-radius:999px;padding:12px 22px;font-weight:700;font-size:1rem;box-shadow:0 4px 14px var(--shade);z-index:10}

.sheet-back{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:1.15rem;font-family:var(--f-display);font-weight:400}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label,.field .lbl{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0;font-size:16px}
.inline{display:flex;gap:6px;align-items:center}
.inline input{flex:1}
.hint{font-size:.78rem;color:var(--muted)}
.hint.err{color:var(--bad)} .hint.good{color:var(--ok)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.actions .spacer{flex:1}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.detail-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 6px;font-size:.9rem}
.detail-dl dt{color:var(--muted)} .detail-dl dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
.banner{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:12px}

.login{max-width:420px;margin:0 auto;padding-block:8px 40px;display:flex;flex-direction:column;gap:14px}
.login p{margin:0}
.login .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.login .gbtn{width:100%;padding:12px;font-size:1rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:.85rem;text-decoration:underline;text-align:left}

@media (max-width:380px){.form{grid-template-columns:1fr}.tile b{font-size:1.25rem}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hazard" aria-hidden="true"></div>
    <div class="head">
      <h1>わが家の備蓄帳</h1>
      <div class="inline">
        <span class="offline" id="offline" hidden>オフライン</span>
        <span class="today" id="today"></span>
        <button class="acct" id="acctBtn" type="button" hidden>ログアウト</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- サインイン画面 -->
  <section id="login" class="login" hidden>
    <p>家族で共有する備蓄帳です。登録されたアカウントでログインしてください。</p>
    <div class="card">
      <button class="btn primary gbtn" id="googleBtn" type="button">Googleでログイン</button>
      <div class="or">または</div>
      <div class="field"><label for="lEmail">メールアドレス</label><input id="lEmail" type="email" autocomplete="email"></div>
      <div class="field"><label for="lPass">パスワード（6文字以上）</label><input id="lPass" type="password" autocomplete="current-password"></div>
      <div class="inline"><button class="btn" id="emailIn" type="button">ログイン</button><button class="btn" id="emailUp" type="button">新規登録</button></div>
      <button class="linkbtn" id="resetBtn" type="button">パスワードを忘れた</button>
      <span class="hint" id="loginMsg"></span>
    </div>
  </section>

  <!-- メール確認待ち -->
  <section id="verify" class="login" hidden>
    <div class="card">
      <strong>メールアドレスの確認が必要です</strong>
      <p class="note" id="verifyText"></p>
      <div class="inline"><button class="btn primary" id="verifiedBtn" type="button">確認した</button><button class="btn" id="resendBtn" type="button">メールを再送</button></div>
      <span class="hint" id="verifyMsg"></span>
    </div>
  </section>

  <!-- 本体 -->
  <div id="app" hidden>
    <section class="summary" aria-label="概要">
      <button class="tile bad" id="tExpired" type="button"><b>–</b><span>期限切れ</span></button>
      <button class="tile warn" id="tSoon" type="button"><b>–</b><span>30日以内に期限</span></button>
      <button class="tile" id="tDays" type="button"><b>–</b><span>備え（日分）</span></button>
    </section>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="stock" aria-selected="true">在庫<span class="n" id="nStock"></span></button>
      <button role="tab" data-tab="need" aria-selected="false">必要量</button>
      <button role="tab" data-tab="shop" aria-selected="false">買い足し<span class="n" id="nShop"></span></button>
      <button role="tab" data-tab="log" aria-selected="false">記録</button>
    </nav>
    <main id="view"></main>
  </div>
</div>

<button class="fab" id="fab" type="button" hidden>＋ 追加</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script type="module" src="app.js"></script>
</body>
</html>
